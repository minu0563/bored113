<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #282c34;
            color: white;
            font-family: Arial, sans-serif;
        }
        .circle {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            transition: 0.2s;
            cursor: pointer;
            display: none;
        }
        .score {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <p class="score">0</p>
    <div class="menu">
        <button onclick="location.reload()">Restart</button>
        <button onclick="start('click')">mode1 (Click)</button>
        <button onclick="start('hover')">mode2 (Hover)</button>
        <button onclick="plusBall()">+</button>
        <button onclick="unplusBall()">-</button>
    </div>
    <div class="circle"></div>
    <script>
        const scoreDisplay = document.querySelector('.score');
        let score = 0;
        let mode = '';
        let circles = [];

        function moveCircle(circle) {
            const x = Math.random() * (window.innerWidth - circle.offsetWidth);
            const y = Math.random() * (window.innerHeight - circle.offsetHeight);
            circle.style.left = `${x}px`;
            circle.style.top = `${y}px`;
        }

        function upScore(event) {
            score++;
            scoreDisplay.textContent = score;
            moveCircle(event.target);
        }

        function start(selectedMode) {
            mode = selectedMode;
            score = 0;
            scoreDisplay.textContent = score;
            circles.forEach(c => c.remove());
            circles = [];
            const firstCircle = document.querySelector('.circle');
            firstCircle.style.display = 'block';
            firstCircle.style.left = '50%';
            firstCircle.style.top = '75%';
            attachEvent(firstCircle);
            moveCircle(firstCircle);
            circles.push(firstCircle);
        }

        function attachEvent(circle) {
            if (mode === 'click') circle.addEventListener('click', upScore);
            else if (mode === 'hover') circle.addEventListener('mouseenter', upScore);
        }

        function plusBall() {
            if (mode === '') return;
            const newCircle = document.createElement('div');
            newCircle.classList.add('circle');
            document.body.appendChild(newCircle);
            newCircle.style.display = 'block';
            attachEvent(newCircle);
            moveCircle(newCircle);
            circles.push(newCircle);
        }

        function unplusBall() {
            if (circles.length <= 1) return;
            const lastCircle = circles.pop();
            lastCircle.remove();
        }
    </script>
</body>
</html>
